# Optional HTTPS overlay: puts linuxserver/swag (nginx + Let's Encrypt via
# Cloudflare DNS-01) in front of ipMagnet and turns on TRUST_PROXY. Needs
# SWAG_URL, SWAG_EMAIL and IPMAGNET_BIND=127.0.0.1 in .env, and a Cloudflare
# token in swag-config/dns-conf/cloudflare.ini. See "HTTPS with SWAG" in
# README.md for the full setup.

services:
  ipmagnet:
    environment:
      TRUST_PROXY: "true"

  swag:
    image: lscr.io/linuxserver/swag:latest
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${SWAG_TZ:-Etc/UTC}
      - URL=${SWAG_URL:?set SWAG_URL to your domain, e.g. in .env}
      - SUBDOMAINS=ipmagnet
      - ONLY_SUBDOMAINS=true
      - VALIDATION=dns
      - DNSPLUGIN=cloudflare
      - EMAIL=${SWAG_EMAIL:?set SWAG_EMAIL for Let's Encrypt, e.g. in .env}
    volumes:
      - ${SWAG_CONFIG_DIR:-./swag-config}:/config
    ports:
      - "80:80"
      - "443:443"
    # nginx, PHP-FPM and fail2ban idle around 50 MB; certbot adds some during
    # renewals. Raise via .env if you serve other apps through this SWAG.
    mem_limit: ${SWAG_MEM_LIMIT:-512m}
    # Docker's default json-file logging never rotates.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    depends_on:
      - ipmagnet
