services:
  ipmagnet:
    build: .
    ports:
      # Override with IPMAGNET_BIND/IPMAGNET_PORT (e.g. via .env) to restrict
      # this to loopback when fronting it with a reverse proxy - see
      # docker-compose.swag.yml. Compose merges `ports` additively across -f
      # files rather than replacing it, so it can't be overridden there.
      - "${IPMAGNET_BIND:-0.0.0.0}:${IPMAGNET_PORT:-80}:80"
    environment:
      # Public URL of this instance, must include the trailing slash.
      TRACKER_URL: "http://localhost/"
      ENABLE_INTERVAL: "false"
      TRACKER_INTERVAL: "300"
      # Use the client IP from a reverse proxy's X-Real-IP header. Enable only
      # when ipMagnet is reachable solely through your own proxy.
      TRUST_PROXY: "false"
    volumes:
      - ipmagnet-data:/var/www/data
    # Nothing in the image needs setuid binaries once the entrypoint (already
    # root) hands over to Apache, and the process cap stops a fork bomb from
    # exhausting the host's PIDs.
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    # Idles around 20 MB. The cap keeps a runaway process from pushing the
    # whole host into swap or the OOM killer; raise it via .env if needed.
    mem_limit: ${IPMAGNET_MEM_LIMIT:-256m}
    restart: unless-stopped

volumes:
  ipmagnet-data:
